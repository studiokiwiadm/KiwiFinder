# Acorda o KiwiFinder uma vez por dia para rodar, e deixa dormir de novo.
#
# Por que não deixar acordado: o plano free do Render dá 750 horas de instância
# por mês para o workspace INTEIRO. Um serviço ligado 24/7 come ~730 delas e não
# sobra nada para outro projeto. Uma rodada leva ~3 minutos — uma por dia dá
# ~1,5 hora no mês, e o resto fica livre.
#
# De quebra, isso mantém o Supabase ativo: projeto free pausa depois de uma
# semana sem uso.
#
# Configurar (uma vez): no GitHub, Settings -> Secrets and variables -> Actions,
# aba "Secrets", botão "New repository secret":
#   CRON_TOKEN  o mesmo valor posto na variável CRON_TOKEN do Render
#
# O endereço do serviço fica aqui embaixo, à vista, porque não é segredo: é o
# site público. Deixá-lo como secret só criava um jeito silencioso de quebrar —
# secret ausente vira string vazia, o curl recebe uma URL sem domínio e morre
# com "URL malformada" antes de sair da máquina.
# Para apontar para outro endereço sem editar este arquivo, crie a VARIÁVEL
# (aba "Variables", não "Secrets") KIWI_URL.

name: Rodada de preços

on:
  schedule:
    # Uma vez por dia, 11:07 UTC = 08:07 em Brasília — preço fresco na hora que
    # você acorda. O agendador do GitHub costuma atrasar alguns minutos em
    # horário de pico; para preço, tanto faz.
    - cron: '7 11 * * *'
  # Permite disparar na mão pela aba Actions, útil para testar.
  workflow_dispatch:

jobs:
  rodar:
    runs-on: ubuntu-latest
    env:
      KIWI_URL: ${{ vars.KIWI_URL || 'https://kiwifinder.onrender.com' }}
      CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
    steps:
      # Falta de configuração não é falha da rodada, é tarefa pendente. Se isto
      # falhasse, o GitHub mandaria um e-mail POR HORA para dizer a mesma coisa.
      # Avisa no resumo do run e encerra em paz.
      - name: Conferir configuração
        id: check
        run: |
          if [ -z "$CRON_TOKEN" ]; then
            echo "::warning::CRON_TOKEN não está configurado nos secrets deste repositório. A rodada foi pulada. Configure em Settings -> Secrets and variables -> Actions, com o mesmo valor da variável CRON_TOKEN no Render."
            echo "seguir=nao" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Acordar o serviço
        if: steps.check.outputs.seguir == 'sim'
        # A primeira chamada depois de dormir demora ~1 minuto (cold start).
        run: |
          curl --silent --show-error --fail --max-time 180 \
            "$KIWI_URL/saude" || echo "ainda acordando"

      - name: Rodar
        if: steps.check.outputs.seguir == 'sim'
        # --max-time generoso: a rodada inteira acontece dentro desta chamada,
        # de propósito, para o Render não suspender a instância no meio.
        run: |
          resposta=$(curl --silent --show-error --fail --max-time 900 \
            -H "Authorization: Bearer $CRON_TOKEN" \
            "$KIWI_URL/api/rodar-agendado")
          echo "$resposta"
          echo "$resposta" | grep -q '"ok":true' || exit 1
